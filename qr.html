<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ป้าย QR สำหรับหน้างาน</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffffff'/%3E%3Ccircle cx='13' cy='17' r='7' fill='none' stroke='%23a21925' stroke-width='2'/%3E%3Ccircle cx='20' cy='17' r='7' fill='none' stroke='%23c2303c' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Sriracha&family=Mali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --wine-900: #ffffff;
    --wine-800: #fdfbfa;
    --wine:     #fffdfc;
    --gold:      #a21925;
    --gold-soft: #c2303c;
    --gold-dim:  #8d2833;
    --cream:     #4a3126;
    --line: rgba(162, 25, 37, .25);
    --th-display: 'Sriracha', 'Charm', cursive;
    --th-body: 'Mali', 'Noto Sans Thai', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    font-family: var(--th-body);
    font-weight: 500;
    color: var(--cream);
    background: var(--wine-900);
    -webkit-font-smoothing: antialiased;
  }

  .panel { max-width: 640px; margin: 0 auto; }

  h1 {
    margin: 0 0 .4rem;
    font-family: var(--th-display);
    font-weight: 400;   /* ฟอนต์นี้มีน้ำหนักเดียว */
    font-weight: 600;
    font-size: 1.9rem;
    text-align: center;
  }
  .sub { margin: 0 0 2rem; text-align: center; font-size: .92rem; color: rgba(74, 49, 38,.6); }

  .field { display: block; margin-bottom: 1rem; }
  .field__label { display: block; margin-bottom: .35rem; font-size: .8rem; letter-spacing: .18em; color: var(--gold-dim); }
  .field__input {
    width: 100%;
    padding: .6rem .8rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: rgba(162, 25, 37, .02);
    color: var(--cream);
    font: inherit;
    font-size: 1rem;
  }
  .field__input:focus { outline: none; border-color: var(--gold); }

  .row { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin: 1.4rem 0 2.4rem; }
  .btn {
    padding: .6rem 1.4rem;
    border: 1px solid rgba(162, 25, 37,.5);
    border-radius: 6px;
    background: transparent;
    color: var(--cream);
    font: inherit;
    font-size: .95rem;
    cursor: pointer;
  }
  .btn:hover { background: rgba(162, 25, 37,.15); border-color: var(--gold); }
  .btn--solid { background: var(--gold); border-color: var(--gold); color: var(--wine-900); }

  .error { margin: 0 0 1rem; text-align: center; color: #b3121f; font-size: .9rem; }

  /* ---------- ป้ายสำหรับพิมพ์ ---------- */
  .poster {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    aspect-ratio: 1 / 1.414;          /* สัดส่วน A4 / A5 */
    container-type: inline-size;      /* ให้หน่วย cqw อ้างความกว้างของป้ายนี้ */
    padding: 6% 7%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(.9rem, 3.5%, 1.8rem);
    text-align: center;
    border-radius: 10px;
    background: radial-gradient(120% 60% at 50% 0%, var(--wine) 0%, var(--wine-800) 45%, var(--wine-900) 100%);
    box-shadow: 0 20px 50px rgba(162, 25, 37, .04);
    position: relative;
  }
  /* กรอบสองชั้น เส้นนอกหนากว่าเส้นใน */
  .poster::before,
  .poster::after {
    content: '';
    position: absolute;
    pointer-events: none;
    border-radius: 3px;
  }
  .poster::before { inset: 2.6%; border: 1.5px solid rgba(162, 25, 37,.45); }
  .poster::after  { inset: 4.2%; border: 1px solid rgba(162, 25, 37,.22); }

  /* ลายมุมทั้งสี่ วางทับกรอบตรงหัวมุม */
  .poster__corner {
    position: absolute;
    width: 9%;
    height: auto;
    fill: none;
    stroke: rgba(162, 25, 37,.55);
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }
  .poster__corner--tl { top: 2.2%;    left: 2.2%; }
  .poster__corner--tr { top: 2.2%;    right: 2.2%;  transform: scaleX(-1); }
  .poster__corner--bl { bottom: 2.2%; left: 2.2%;   transform: scaleY(-1); }
  .poster__corner--br { bottom: 2.2%; right: 2.2%;  transform: scale(-1); }

  /* เส้นคั่นเล็ก ๆ ใต้หัวเรื่อง */
  .poster__rule {
    width: 22%;
    height: auto;
    stroke: rgba(162, 25, 37,.5);
    stroke-width: 1.4;
    fill: none;
    margin: .1rem auto 0;
    display: block;
  }

  .poster__eyebrow span { display: inline-block; }
  .poster__eyebrow {
    margin: 0 auto;
    max-width: 30ch;
    font-size: 3.7cqw;
    letter-spacing: .14em;
    text-indent: .14em;
    line-height: 1.9;
    color: var(--gold-dim);
  }
  .poster__names { margin: .35em 0 0; font-family: var(--th-display); font-weight: 400; font-size: 9cqw; line-height: 1.3; color: var(--cream); }
  .poster__ar { margin: .25em 0 0; font-family: 'Amiri', serif; font-size: 5.6cqw; color: var(--gold); }

  .poster__qr {
    width: 66%;
    padding: 4%;
    background: #fff;
    border-radius: 8px;
    line-height: 0;
  }
  .poster__qr svg { width: 100%; height: auto; display: block; }

  .poster__cta { margin: 0; font-family: var(--th-display); font-size: 7.2cqw; color: var(--gold-soft); font-weight: 400;   /* ฟอนต์นี้มีน้ำหนักเดียว */ }
  .poster__hint { margin: .5em 0 0; font-size: 3.4cqw; color: rgba(74, 49, 38,.55); line-height: 1.85; }

  @media print {
    body { background: #fff; padding: 0; }
    .panel > *:not(.poster) { display: none !important; }
    .poster {
      max-width: none;
      width: 100%;
      height: 100vh;
      aspect-ratio: auto;
      border-radius: 0;
      box-shadow: none;
      break-inside: avoid;
    }
    @page { margin: 0; size: A4 portrait; }
  }
</style>
</head>
<body>

<div class="panel">
  <h1>ป้าย QR สำหรับหน้างาน</h1>
  <p class="sub">พิมพ์ออกมาวางที่โต๊ะต้อนรับ แขกสแกนแล้วเช็คอินและอวยพรได้เลย</p>

  <label class="field">
    <span class="field__label">ลิงก์หน้าเช็คอิน</span>
    <input class="field__input" id="url" type="url" spellcheck="false">
  </label>

  <p class="error" id="error" hidden></p>

  <div class="row">
    <button class="btn btn--solid" type="button" id="print">สั่งพิมพ์</button>
    <button class="btn" type="button" id="svg">ดาวน์โหลด SVG</button>
    <button class="btn" type="button" id="png">ดาวน์โหลด PNG</button>
  </div>

  <div class="poster" id="poster">
    <svg class="poster__corner poster__corner--tl" viewBox="0 0 64 64" aria-hidden="true"><path d="M2 30 C2 14, 14 2, 30 2"/><path d="M2 46 C2 20, 20 2, 46 2" opacity=".45"/><path d="M13 13 l7 0 m-7 0 l0 7"/><circle cx="13" cy="13" r="2.2"/></svg><svg class="poster__corner poster__corner--tr" viewBox="0 0 64 64" aria-hidden="true"><path d="M2 30 C2 14, 14 2, 30 2"/><path d="M2 46 C2 20, 20 2, 46 2" opacity=".45"/><path d="M13 13 l7 0 m-7 0 l0 7"/><circle cx="13" cy="13" r="2.2"/></svg><svg class="poster__corner poster__corner--bl" viewBox="0 0 64 64" aria-hidden="true"><path d="M2 30 C2 14, 14 2, 30 2"/><path d="M2 46 C2 20, 20 2, 46 2" opacity=".45"/><path d="M13 13 l7 0 m-7 0 l0 7"/><circle cx="13" cy="13" r="2.2"/></svg><svg class="poster__corner poster__corner--br" viewBox="0 0 64 64" aria-hidden="true"><path d="M2 30 C2 14, 14 2, 30 2"/><path d="M2 46 C2 20, 20 2, 46 2" opacity=".45"/><path d="M13 13 l7 0 m-7 0 l0 7"/><circle cx="13" cy="13" r="2.2"/></svg>
    <div>
      <p class="poster__eyebrow" id="posterEyebrow"><span>ยินดีต้อนรับสู่งาน</span> <span>วะลีมะตุลนิกะห์</span></p>
      <p class="poster__names" id="names">—</p>
      <p class="poster__ar" dir="rtl" id="namesAr"></p>
      <svg class="poster__rule" viewBox="0 0 120 12" aria-hidden="true"><path d="M4 6 H44"/><path d="M76 6 H116"/><path d="M60 1 L65 6 L60 11 L55 6 Z"/><circle cx="49" cy="6" r="1.4"/><circle cx="71" cy="6" r="1.4"/></svg>
    </div>

    <div class="poster__qr" id="qrBox"></div>

    <div>
      <p class="poster__cta">สแกนเพื่อเช็คอิน</p>
      <p class="poster__hint">
        เปิดกล้องมือถือส่องที่ QR แล้วแตะลิงก์<br>
        เช็คอิน · ส่งคำอวยพร · ถ่ายการ์ด · อัดคลิป
      </p>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/qrcode.js"></script>
<script>
(function () {
  'use strict';
  var cfg = window.WEDDING_CONFIG || {};
  var couple = cfg.couple || {};
  var $ = function (s) { return document.querySelector(s); };

  var groom = (couple.groom && couple.groom.th) || '';
  var bride = (couple.bride && couple.bride.th) || '';
  $('#names').textContent = groom && bride ? groom + ' & ' + bride : 'งานนิกะหฺ';

  var groomAr = (couple.groom && couple.groom.ar) || '';
  var brideAr = (couple.bride && couple.bride.ar) || '';
  $('#namesAr').textContent = groomAr && brideAr ? groomAr + ' & ' + brideAr : '';

  var input = $('#url');
  var defaultUrl = location.href.replace(/qr\.html.*$/, 'checkin.html');
  input.value = (location.protocol === 'file:') ? 'https://example.com/checkin.html' : defaultUrl;

  function render() {
    var box = $('#qrBox');
    var error = $('#error');
    var value = input.value.trim();

    box.textContent = '';
    error.hidden = true;

    if (!value) { error.textContent = 'กรุณาใส่ลิงก์หน้าเช็คอิน'; error.hidden = false; return; }

    try {
      box.innerHTML = window.QRCode.toSvg(value, { scale: 8, margin: 1, dark: '#2a0912', light: '#ffffff' });
    } catch (err) {
      error.textContent = err.message;
      error.hidden = false;
    }
  }

  input.addEventListener('input', render);
  render();

  $('#print').addEventListener('click', function () { window.print(); });

  function download(href, filename) {
    var link = document.createElement('a');
    link.href = href;
    link.download = filename;
    link.click();
  }

  $('#svg').addEventListener('click', function () {
    var svg = $('#qrBox').innerHTML;
    if (!svg) return;
    var blob = new Blob([svg], { type: 'image/svg+xml' });
    var url = URL.createObjectURL(blob);
    download(url, 'checkin-qr.svg');
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  $('#png').addEventListener('click', function () {
    var value = input.value.trim();
    if (!value) return;

    // วาดลงแคนวาสเองเพื่อให้ได้ไฟล์คมชัดขนาดใหญ่ ไม่ต้องพึ่งการแปลง SVG
    var qr = window.QRCode.generate(value);
    var margin = 4;
    var scale = 16;
    var side = (qr.size + margin * 2) * scale;

    var canvas = document.createElement('canvas');
    canvas.width = side;
    canvas.height = side;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, side, side);
    ctx.fillStyle = '#2a0912';
    for (var r = 0; r < qr.size; r++) {
      for (var c = 0; c < qr.size; c++) {
        if (qr.modules[r][c]) {
          ctx.fillRect((c + margin) * scale, (r + margin) * scale, scale, scale);
        }
      }
    }
    download(canvas.toDataURL('image/png'), 'checkin-qr.png');
  });
})();
</script>
</body>
</html>
