<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วะลีมะฮฺ มุบีน &amp; ฟาฮาดา</title>
<meta name="description" content="ขอเรียนเชิญร่วมงานนิกะหฺ มุบีน & ฟาฮาดา">
<meta property="og:type" content="website">
<meta property="og:title" content="วะลีมะฮฺ มุบีน & ฟาฮาดา">
<meta property="og:description" content="ขอเรียนเชิญร่วมงานนิกะหฺ · 15 พฤศจิกายน 2569">
<!--
  รูปพรีวิวตอนแชร์ในไลน์/เฟซบุ๊ก ต้องเป็น URL เต็ม (ขึ้นต้นด้วย https://)
  ตัวขูดข้อมูลของไลน์กับเฟซบุ๊กไม่รันจาวาสคริปต์ จึงอ่านค่าจาก config.js ไม่ได้
  ถ้าย้ายไปโดเมนอื่น ต้องแก้ og:url กับ og:image สองบรรทัดนี้ตามด้วย
-->
<meta property="og:url" content="https://myweddingday151169.web.app/">
<meta property="og:image" content="https://myweddingday151169.web.app/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffffff'/%3E%3Ccircle cx='13' cy='17' r='7' fill='none' stroke='%23a21925' stroke-width='2'/%3E%3Ccircle cx='20' cy='17' r='7' fill='none' stroke='%23c2303c' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Sriracha&family=Cormorant+Garamond:wght@300;400;500&family=Mali:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ---------- คลังลายเส้น ใช้ซ้ำด้วย <use href="#..."> ---------- -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <!-- เส้นคั่นระหว่างหมวด: เส้นตรงสองข้าง ขนาบใบไม้และข้าวหลามตัดตรงกลาง -->
    <symbol id="orn-divider" viewBox="0 0 260 26">
      <path d="M6 13 H94"/>
      <path d="M166 13 H254"/>
      <path d="M130 4 L139 13 L130 22 L121 13 Z"/>
      <path d="M104 13 C110 5, 118 5, 118 13 C118 21, 110 21, 104 13 Z"/>
      <path d="M156 13 C150 5, 142 5, 142 13 C142 21, 150 21, 156 13 Z"/>
      <circle cx="99" cy="13" r="1.6"/>
      <circle cx="161" cy="13" r="1.6"/>
    </symbol>

    <!-- มุมการ์ด: เส้นโค้งซ้อนสองชั้นกับจุดเล็ก ๆ -->
    <symbol id="orn-corner" viewBox="0 0 64 64">
      <path d="M2 30 C2 14, 14 2, 30 2"/>
      <path d="M2 46 C2 20, 20 2, 46 2" opacity=".45"/>
      <path d="M13 13 l7 0 m-7 0 l0 7"/>
      <circle cx="13" cy="13" r="2.2"/>
    </symbol>
  </defs>
</svg>

<!-- ---------- ซองจดหมาย ---------- -->
<div class="cover" id="cover">
  <div class="cover__panel">
    <!-- ลายดาวแปดแฉกแบบเซลจุค ซ้ำไปตามขอบทั้งสี่ด้าน (ลายอยู่ใน style.css) -->
    <span class="cover__pattern" aria-hidden="true"></span>
    <p class="cover__word" dir="rtl" data-bind="coverWord">&nbsp;</p>
    <div class="cover__arch">
      <!-- แหวนสองวงคล้องกันเป็นกุญแจล็อคการ์ดไว้ แตะแล้วคลายออกจากกัน
           วงซ้ายวาดทับวงขวาตรงจุดตัดด้านบน (.lock__link) แหวนจึงดูสอดกันจริง -->
      <button class="lock" id="coverLock" type="button"
              aria-label="แตะเพื่อปลดล็อคและเปิดการ์ด">
        <svg class="lock__art" viewBox="0 0 220 150" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="goldRing" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#f2dcae"/>
              <stop offset="45%"  stop-color="#c9a063"/>
              <stop offset="100%" stop-color="#8a6a34"/>
            </linearGradient>
          </defs>

          <g class="lock__glow">
            <circle cx="85"  cy="75" r="42"/>
            <circle cx="135" cy="75" r="42"/>
          </g>

          <circle class="lock__ring lock__ring--l" cx="85"  cy="75" r="42"/>
          <circle class="lock__ring lock__ring--r" cx="135" cy="75" r="42"/>
          <!-- ชิ้นส่วนสั้น ๆ ของวงซ้าย วาดทับวงขวาให้เกิดการสอดคล้อง -->
          <path class="lock__link" d="M 98.7 35.3 A 42 42 0 0 1 119 50.3"/>
        </svg>
      </button>
      <p class="cover__names">
        <span data-bind="couple.groom.en"></span>
        <i>·</i>
        <span data-bind="couple.bride.en"></span>
      </p>
    </div>
    <p class="cover__hint" data-bind="coverHint">&nbsp;</p>
  </div>
</div>

<!-- ---------- การ์ด ---------- -->
<main class="sheet" id="card" hidden>
 <article class="panel">
  <svg class="corner corner--tl" viewBox="0 0 64 64" aria-hidden="true"><use href="#orn-corner"/></svg>
  <svg class="corner corner--tr" viewBox="0 0 64 64" aria-hidden="true"><use href="#orn-corner"/></svg>
  <svg class="corner corner--bl" viewBox="0 0 64 64" aria-hidden="true"><use href="#orn-corner"/></svg>
  <svg class="corner corner--br" viewBox="0 0 64 64" aria-hidden="true"><use href="#orn-corner"/></svg>

  <!-- เปิดการ์ด -->
  <section class="block block--open">
    <p class="bismillah" dir="rtl" data-bind="bismillah">&nbsp;</p>
    <p class="invite-line" data-bind="inviteLine">&nbsp;</p>

    <h1 class="names-ar" dir="rtl">
      <span data-bind="couple.groom.ar"></span>
      <i class="amp">&amp;</i>
      <span data-bind="couple.bride.ar"></span>
    </h1>
    <p class="names-th">
      <span data-bind="couple.groom.th"></span>
      <i class="amp">&amp;</i>
      <span data-bind="couple.bride.th"></span>
    </p>

    <div class="verse">
      <p class="verse__ar" dir="rtl" data-bind="verse.ar"></p>
      <p class="verse__th" data-bind="verse.th"></p>
      <p class="verse__ref" data-bind="verse.ref"></p>
    </div>
  </section>

  <!-- วันที่ -->
  <section class="block block--date reveal">
    <p class="date__weekday" data-bind="date.weekdayTh"></p>
    <p class="date__day" data-bind="date.day"></p>
    <p class="date__month" data-bind="date.monthYearTh"></p>
    <p class="date__hijri" dir="rtl" data-bind="date.hijri"></p>
  </section>

  <!-- กำหนดการ -->
  <section class="block block--schedule reveal">
    <ol class="agenda" id="agenda"></ol>
  </section>

  <!-- สถานที่ -->
  <section class="block block--venue reveal">
    <p class="label">สถานที่</p>
    <p class="venue__name" data-bind="venue.name"></p>
    <div class="venue__address" id="venueAddress"></div>
    <div class="venue__map" id="venueMap"></div>
    <div class="actions">
      <a class="btn" id="mapLink" href="#" target="_blank" rel="noopener">เปิดแผนที่</a>
      <a class="btn" id="calendarLink" href="#" target="_blank" rel="noopener">เพิ่มลงปฏิทิน</a>
    </div>
  </section>

  <!-- นับถอยหลัง -->
  <section class="block block--count reveal">
    <p class="label">นับถอยหลัง</p>
    <ul class="countdown" id="countdown" aria-live="polite">
      <li><strong data-count="days">0</strong><span>วัน</span></li>
      <li><strong data-count="hours">00</strong><span>ชม.</span></li>
      <li><strong data-count="minutes">00</strong><span>นาที</span></li>
      <li><strong data-count="seconds">00</strong><span>วิ</span></li>
    </ul>
    <p class="countdown__done" id="countdownDone" hidden>บารอกัลลอฮุ ลากุมา — ขอบคุณที่มาร่วมงานกับเรา</p>
  </section>

  <!-- แกลเลอรี (ซ่อนอัตโนมัติถ้าไม่มีรูปใน config) -->
  <section class="block block--gallery reveal" id="gallery" hidden>
    <p class="label">ช่วงเวลาของเรา</p>
    <div class="gallery" id="galleryGrid"></div>
  </section>


  <!-- สแกนเข้างาน (โผล่เฉพาะเมื่อเปิดไว้ใน config) -->
  <section class="block block--scan reveal" id="scan" hidden>
    <p class="label" data-bind="checkin.title"></p>
    <p class="scan__note" data-bind="checkin.note"></p>
    <a class="btn btn--solid btn--scan" id="scanLink" href="checkin.html">
      <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4M7 12h10"/>
      </svg>
      <span data-bind="checkin.button"></span>
    </a>
  </section>

  <!-- ตอบรับคำเชิญ -->
  <section class="block block--rsvp reveal" id="rsvp" hidden>
    <p class="label" data-bind="rsvp.title"></p>
    <form class="form" id="rsvpForm" novalidate>
      <div class="field">
        <label class="field__label" for="rsvpName">ชื่อผู้ตอบรับ</label>
        <input class="field__input" id="rsvpName" name="name" type="text"
               placeholder="ชื่อ–นามสกุล" autocomplete="name" required maxlength="120">
      </div>

      <div class="field">
        <span class="field__label" id="attendLabel">จะมาร่วมงานไหม</span>
        <div class="choice" role="radiogroup" aria-labelledby="attendLabel">
          <button type="button" class="choice__btn is-active" data-attend="yes" role="radio" aria-checked="true">มาร่วมงาน</button>
          <button type="button" class="choice__btn" data-attend="no" role="radio" aria-checked="false">ไม่สะดวก</button>
        </div>
      </div>

      <div class="field" id="guestField">
        <label class="field__label" for="rsvpGuests">จำนวนผู้ร่วมงาน</label>
        <select class="field__input" id="rsvpGuests" name="guests"></select>
      </div>

      <button class="btn btn--solid" type="submit" id="rsvpSubmit">ส่งคำตอบรับ</button>
      <p class="form__note" data-bind="rsvp.note"></p>
    </form>
  </section>

  <!-- ร่วมแสดงความยินดี (ซ่อนอัตโนมัติถ้าปิดใน config) -->
  <section class="block block--gift reveal" id="gift" hidden>
    <p class="label">ร่วมแสดงความยินดี</p>
    <p class="gift__note" data-bind="gifts.note"></p>
    <div class="accounts" id="accounts"></div>
  </section>

  <!-- ดุอาอ์ปิดท้าย -->
  <footer class="block block--dua reveal">
    <div class="rule" aria-hidden="true"></div>
    <p class="dua__ar" dir="rtl" data-bind="dua.ar"></p>
    <p class="dua__th" data-bind="dua.th"></p>
    <p class="closing__lead" data-bind="closing.lead"></p>
    <p class="closing__host" data-bind="closing.host"></p>
  </footer>

 </article>
 <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<audio id="bgm" loop preload="none"></audio>
<button class="music-toggle" id="musicToggle" hidden aria-label="เปิด/ปิดเพลง">♪</button>

<script src="assets/js/config.js"></script>
<script src="assets/js/cloudinary.js"></script>
<script src="assets/js/inline-media.js"></script>
<script src="assets/js/firebase.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/backend.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
